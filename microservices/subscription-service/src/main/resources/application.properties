spring.application.name=subscription-service

# Phase 3 migration strategy:
# Subscription Service temporarily owns the existing subscriptions and payments tables
# in the shared database. Flyway remains owned by the monolith until databases separate.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Service-to-service communication
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
internal.service.key=${INTERNAL_SERVICE_KEY}

# Paystack
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.callback.url=${PAYSTACK_CALLBACK_URL:http://localhost:8080/vault/payments/callback}

# Manual upgrades are unsafe in production. Keep disabled unless intentionally testing.
subscription.manual-upgrade-enabled=${MANUAL_SUBSCRIPTION_UPGRADE_ENABLED:false}

server.address=0.0.0.0
server.port=${PORT:8083}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Strict request-body parsing. Unknown fields are discarded by DTO binding to preserve
# backward compatibility while preventing mass assignment; duplicate/trailing JSON is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
