spring.application.name=vault-service

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}
internal.service.key=${INTERNAL_SERVICE_KEY}

vault.password.secret=${VAULT_PASSWORD_SECRET}
vault.document.secret=${VAULT_DOCUMENT_SECRET}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB

storage.b2.enabled=${B2_ENABLED:false}
storage.b2.endpoint=${B2_ENDPOINT:}
storage.b2.region=${B2_REGION:us-west-004}
storage.b2.bucket=${B2_BUCKET:}
storage.b2.key-id=${B2_KEY_ID:}
storage.b2.application-key=${B2_APPLICATION_KEY:}

server.address=0.0.0.0
server.port=${PORT:8084}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
