spring.application.name=backup-recovery-service
spring.banner.location=classpath:banner.txt

# Shared-database migration stage. Flyway remains owned by the monolith.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Service-to-service communication
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}
services.vault.url=${VAULT_SERVICE_URL:http://localhost:8084}
services.access-sharing.url=${ACCESS_SHARING_SERVICE_URL:http://localhost:8085}
internal.service.key=${INTERNAL_SERVICE_KEY}

# Must remain identical to the monolith value so existing .tgvault files remain readable.
vault.backup.secret=${BACKUP_SECRET}

server.address=0.0.0.0
server.port=${PORT:8086}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Strict request-body parsing. Unknown fields are discarded by DTO binding to preserve
# backward compatibility while preventing mass assignment; duplicate/trailing JSON is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
