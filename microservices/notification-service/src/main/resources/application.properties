spring.application.name=notification-service

# Phase 2 migration strategy:
# Notification Service temporarily owns the existing notifications table in the shared database.
# Flyway remains owned by the monolith until databases are separated.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Auth Service is the source of truth for JWT and active session validation.
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

# The same high-entropy value must be configured in Auth Service, Notification Service, and the monolith.
internal.service.key=${INTERNAL_SERVICE_KEY}

server.address=0.0.0.0
server.port=${PORT:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Expo Push Service
expo.push.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2}
expo.push.access-token=${EXPO_ACCESS_TOKEN:}
push.dispatch.delay-ms=${PUSH_DISPATCH_DELAY_MS:5000}
push.receipts.delay-ms=${PUSH_RECEIPT_DELAY_MS:60000}

# Strict request-body parsing. Unknown fields are discarded by DTO binding to preserve
# backward compatibility while preventing mass assignment; duplicate/trailing JSON is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
