spring.application.name=support-service
spring.banner.location=classpath:banner.txt

# Shared PostgreSQL database. The monolith remains the Flyway owner for now.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.email.url=${EMAIL_SERVICE_URL:http://localhost:8091}
internal.service.key=${INTERNAL_SERVICE_KEY}

support.admin-email=${ADMIN_SUPPORT_EMAIL:}

server.address=0.0.0.0
server.port=${PORT:8090}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
