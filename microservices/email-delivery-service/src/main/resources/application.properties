spring.application.name=email-delivery-service
spring.banner.location=classpath:banner.txt

internal.service.key=${INTERNAL_SERVICE_KEY}

gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.from=${GMAIL_FROM:}
email.demo-mode=${DEMO_MODE:true}

server.address=0.0.0.0
server.port=${PORT:8091}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Strict request-body parsing. Unknown fields are discarded by DTO binding to preserve
# backward compatibility while preventing mass assignment; duplicate/trailing JSON is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
