spring.application.name=auth-service

# Phase 1 migration strategy:
# Auth Service temporarily uses the existing monolith database/tables.
# Flyway remains owned by the monolith until the Auth database is separated.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT must match the monolith while both applications coexist.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Existing Gmail integration used for verification, reset, and 2FA codes.
GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
GMAIL_FROM=${GMAIL_FROM}
DEMO_MODE=${DEMO_MODE:true}

server.address=0.0.0.0
server.port=${PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Internal microservice communication
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
internal.service.key=${INTERNAL_SERVICE_KEY}
