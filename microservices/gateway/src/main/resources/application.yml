spring:
  application:
    name: api-gateway

  # Spring Cloud Gateway Server Web MVC uses Spring Boot's RestClient
  # infrastructure for downstream proxy calls. Render Free cold starts can
  # legitimately take around a minute, so do not fail a routed request after
  # only a few seconds.
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 120s

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: "${AUTH_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/vault/auth/**,/vault/sessions/**

            - id: notification-service
              uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/vault/notifications,/vault/notifications/**

            - id: subscription-service
              uri: "${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/vault/api/subscriptions,/vault/api/subscriptions/**,/vault/payments,/vault/payments/**

            - id: vault-service
              uri: "${VAULT_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/vault,/api/vault/**,/vault/cards,/vault/cards/**,/vault/documents,/vault/documents/**,/vault/notes,/vault/notes/**

            - id: access-sharing-service
              uri: "${ACCESS_SHARING_SERVICE_URL:http://localhost:8085}"
              predicates:
                - Path=/vault/family,/vault/family/**,/vault/emergency,/vault/emergency/**,/vault/safety-check,/vault/safety-check/**,/vault/estate-playbooks,/vault/estate-playbooks/**,/vault/continuity-drill,/vault/continuity-drill/**

            - id: backup-recovery-service
              uri: "${BACKUP_RECOVERY_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/vault/backup,/vault/backup/**,/vault/recovery-kit,/vault/recovery-kit/**,/vault/recovery-circle,/vault/recovery-circle/**

            - id: user-account-service
              uri: "${USER_ACCOUNT_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/vault/users,/vault/users/**

            - id: security-health-service
              uri: "${SECURITY_HEALTH_SERVICE_URL:http://localhost:8088}"
              predicates:
                - Path=/vault/security-alerts,/vault/security-alerts/**

            - id: support-service
              uri: "${SUPPORT_SERVICE_URL:http://localhost:8090}"
              predicates:
                - Path=/vault/support,/vault/support/**

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

guardian:
  gateway:
    readiness:
      enabled: ${GATEWAY_DOWNSTREAM_READINESS_ENABLED:true}
      # A target cannot have spun down within this window after a successful
      # probe. This keeps normal traffic fast while still detecting Render
      # sleep before the 15-minute idle boundary.
      ready-ttl-ms: ${GATEWAY_DOWNSTREAM_READY_TTL_MS:600000}
      # Render documents that a Free service cold start can take about a minute.
      startup-timeout-ms: ${GATEWAY_DOWNSTREAM_STARTUP_TIMEOUT_MS:90000}
      probe-timeout-ms: ${GATEWAY_DOWNSTREAM_PROBE_TIMEOUT_MS:12000}
      min-backoff-ms: ${GATEWAY_DOWNSTREAM_MIN_BACKOFF_MS:750}
      max-backoff-ms: ${GATEWAY_DOWNSTREAM_MAX_BACKOFF_MS:5000}

logging:
  level:
    com.vault.gateway: INFO
    org.springframework.cloud.gateway: INFO
