spring:
  application:
    name: api-gateway

  http:
    clients:
      connect-timeout: 15s
      read-timeout: 180s

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: "${AUTH_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/vault/auth/**,/vault/sessions/**

            - id: notification-service
              uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/vault/notifications,/vault/notifications/**

            - id: subscription-service
              uri: "${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/vault/api/subscriptions,/vault/api/subscriptions/**,/vault/payments,/vault/payments/**

            - id: vault-service
              uri: "${VAULT_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/vault,/api/vault/**,/vault/cards,/vault/cards/**,/vault/documents,/vault/documents/**,/vault/notes,/vault/notes/**

            - id: access-sharing-service
              uri: "${ACCESS_SHARING_SERVICE_URL:http://localhost:8085}"
              predicates:
                - Path=/vault/family,/vault/family/**,/vault/emergency,/vault/emergency/**,/vault/safety-check,/vault/safety-check/**,/vault/estate-playbooks,/vault/estate-playbooks/**,/vault/continuity-drill,/vault/continuity-drill/**

            - id: backup-recovery-service
              uri: "${BACKUP_RECOVERY_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/vault/backup,/vault/backup/**,/vault/recovery-kit,/vault/recovery-kit/**,/vault/recovery-circle,/vault/recovery-circle/**

            - id: user-account-service
              uri: "${USER_ACCOUNT_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/vault/users,/vault/users/**

            - id: security-health-service
              uri: "${SECURITY_HEALTH_SERVICE_URL:http://localhost:8088}"
              predicates:
                - Path=/vault/security-alerts,/vault/security-alerts/**

            - id: support-service
              uri: "${SUPPORT_SERVICE_URL:http://localhost:8090}"
              predicates:
                - Path=/vault/support,/vault/support/**

server:
  address: 0.0.0.0
  port: ${PORT:8080}

# Render Free services wake on the next real inbound HTTP request. On Free, do
# not preflight/warm downstream services through the public edge: that creates
# extra service-initiated traffic and can be edge-rate-limited before Spring starts.
# The production Blueprint disables this custom guard and lets the actual proxied
# request wake the target service. The 180s backend read timeout allows the route
# request to remain open through a normal cold start.
guardian:
  cold-start:
    enabled: ${GATEWAY_COLD_START_ENABLED:false}
    prewarm-all-on-startup: ${GATEWAY_PREWARM_ALL_ON_STARTUP:false}
    ready-ttl-ms: ${GATEWAY_READY_TTL_MS:600000}
    max-wait-ms: ${GATEWAY_COLD_START_MAX_WAIT_MS:120000}
    probe-timeout-ms: ${GATEWAY_COLD_START_PROBE_TIMEOUT_MS:70000}
    connect-timeout-ms: ${GATEWAY_COLD_START_CONNECT_TIMEOUT_MS:10000}
    initial-backoff-ms: ${GATEWAY_COLD_START_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${GATEWAY_COLD_START_MAX_BACKOFF_MS:5000}

logging:
  level:
    com.vault.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
