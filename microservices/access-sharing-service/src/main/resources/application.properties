spring.application.name=access-sharing-service

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}
services.vault.url=${VAULT_SERVICE_URL:http://localhost:8084}
services.backup-recovery.url=${BACKUP_RECOVERY_SERVICE_URL:http://localhost:8086}
services.email.url=${EMAIL_DELIVERY_SERVICE_URL:http://localhost:8091}
internal.service.key=${INTERNAL_SERVICE_KEY}

server.address=0.0.0.0
server.port=${PORT:8085}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Use a dedicated random secret of at least 32 characters in production.
estate.playbook.secret=${ESTATE_PLAYBOOK_SECRET:${INTERNAL_SERVICE_KEY}}

# Continuity Drill expiry scan
guardian.continuity-drill.initial-delay-ms=${CONTINUITY_DRILL_INITIAL_DELAY_MS:45000}
guardian.continuity-drill.scan-interval-ms=${CONTINUITY_DRILL_SCAN_INTERVAL_MS:300000}

# Strict request-body parsing. Unknown fields are discarded by DTO binding to preserve
# backward compatibility while preventing mass assignment; duplicate/trailing JSON is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
