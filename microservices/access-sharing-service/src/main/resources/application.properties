spring.application.name=access-sharing-service

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}
services.vault.url=${VAULT_SERVICE_URL:http://localhost:8084}
internal.service.key=${INTERNAL_SERVICE_KEY}

server.address=0.0.0.0
server.port=${PORT:8085}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
