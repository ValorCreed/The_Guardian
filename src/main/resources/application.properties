spring.application.name=theguardian

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

##Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

##JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

##PayStack
#paystack.secret.key=${PAYSTACK_SECRET_KEY}
#paystack.callback.url=${PAYSTACK_CALLBACK_URL}

###File upload properties
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
vault.document.secret=change-this-to-a-long-random-secret-for-your-app

####For gmail and 2FA
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

###Network Properties
server.address=0.0.0.0
server.port=8080

###Backup secret key
vault.backup.secret=${BACKUP_SECRET}