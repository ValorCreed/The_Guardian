# Run microservices/database-migration-runner against the target database before the first Blueprint deploy.
services:
  - type: web
    runtime: docker
    name: guardian-vault-email
    rootDir: microservices/email-delivery-service
    plan: free
    region: virginia
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: guardian-vault-auth
          envVarKey: INTERNAL_SERVICE_KEY
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_ERROR_INCLUDE_STACKTRACE
        value: never
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        value: never
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

  - type: web
    runtime: docker
    name: guardian-vault-auth
    rootDir: microservices/auth-service
    plan: free
    region: virginia
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: NOTIFICATION_SERVICE_URL
        value: https://guardian-vault-notifications.onrender.com
      - key: EMAIL_SERVICE_URL
        value: https://guardian-vault-email.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_ERROR_INCLUDE_STACKTRACE
        value: never
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        value: never
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

  - type: web
    runtime: docker
    name: guardian-vault-notifications
    rootDir: microservices/notification-service
