      - key: DATABASE_PASSWORD
        fromService: {type: web, name: guardian-vault-auth, envVarKey: DATABASE_PASSWORD}
      - key: INTERNAL_SERVICE_KEY
        fromService: {type: web, name: guardian-vault-auth, envVarKey: INTERNAL_SERVICE_KEY}
      - key: AUTH_SERVICE_URL
        value: https://guardian-vault-auth.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_ERROR_INCLUDE_STACKTRACE
        value: never
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        value: never
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

  - type: web
    runtime: docker
    name: guardian-vault-subscriptions
    rootDir: microservices/subscription-service
